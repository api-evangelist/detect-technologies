aid: detect-technologies
name: Detect Technologies
description: >-
  Detect Technologies is an industrial AI company founded in 2016 and
  headquartered in Chennai, India, focused on transforming workplace safety,
  security, productivity, and asset inspections across asset-intensive
  industries such as oil and gas, steel, manufacturing, and energy. Its flagship
  platform, T-Pulse, is an AI-powered Health, Safety and Environment (HSE)
  management system that aggregates data from cameras, sensors, equipment, and
  processes to deliver near real-time risk and efficiency insights through
  computer vision and machine learning. The T-Pulse suite spans Workplace
  Safety, Workplace Operations, Workplace Inspections, and Workplace Security
  modules, complemented by predictive maintenance and turnaround (STO)
  orchestration capabilities. Detect Technologies is backed by Prosus Ventures.
